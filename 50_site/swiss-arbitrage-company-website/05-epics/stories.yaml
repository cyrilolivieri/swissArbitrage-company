    title: Design storefront CompactBox
    status: ready
    priority: P0
    next: true
    objective: |
      Construire le thème enfant CompactBox sur Astra, reproduire l’architecture UX de Nomad Goods
      (header, hero, grids de collections, fiches produit, footer), et préparer le site en mode offline
      (HTTP 503 + noindex) jusqu’au GO opérateur.
    stories:
      - id: STORY-001-01
        title: Créer le thème enfant CompactBox
        priority: P0
        acceptance:
          - Dossier wp-content/themes/compactbox/ créé avec style.css (Template: astra), functions.php, screenshot.png
          - Thème enfant activé sans erreur
          - Overrides CSS/JS chargés uniquement via le thème enfant
        notes: |
          Ne PAS modifier Astra parent. Utiliser wp_enqueue_scripts avec version basée sur filemtime.

      - id: STORY-001-02
        title: Header Nomad-like navigation + sélecteur langue + panier
        priority: P0
        acceptance:
          - Header sticky 70–90 px
          - Navigation principale par famille de produit (6 familles MVP)
          - Recherche discret, panier, sélecteur FR/DE/EN/IT
          - Mobile-first avec menu hamburger

      - id: STORY-001-03
        title: Hero pleine largeur homepage
        priority: P0
        acceptance:
          - Hero full-width 60–80vh
          - Titre accrocheur clé actuelle, CTA unique vers le shop
          - Visuel placeholder prêt à être remplacé par asset final

      - id: STORY-001-04
        title: Grids de collections par famille
        priority: P0
        acceptance:
          - Grids 2 cols mobile / 4 cols desktop
          - 6 cards Câbles, Hubs, Stands, Supports, Adaptateurs, Organisateurs
          - Chaque card = image, nom, description courte, lien

      - id: STORY-001-05
        title: Section best-sellers / nouveautés
        priority: P1
        acceptance:
          - Carrousel max 8 produits
          - Ne pas générer de faux avis ni de faux produits

      - id: STORY-001-06
        title: Section storytelling confiance
        priority: P1
        acceptance:
          - Blocs “Livraison suisse”, “Prix comparés”, “Sans compromis”
          - Copy sobre et factuel

      - id: STORY-001-07
        title: Footer multi-colonnes
        priority: P0
        acceptance:
          - Identité vendeur (placeholder si adresse légale non finalisée)
          - Liens CGV, Confidentialité, Livraison, Retours, Contact, Comment commander
          - Paiements acceptés, sélecteur langue

      - id: STORY-001-08
        title: Fiche produit structurée
        priority: P0
        acceptance:
          - Galerie, titre SEO, prix CHF, shipping visible
          - Specs, compatibilité, contenu de la boîte, FAQ
          - CTA “Ajouter au panier"
          - Schema.org Product JSON-LD injecté

      - id: STORY-001-09
        title: Guard offline 503 + noindex
        priority: P0
        acceptance:
          - Tant que compactbox_site_online=no, front renvoie 503 + meta noindex
          - Admin reste accessible
          - Option dans Réglages > CompactBox pour switch online

      - id: STORY-001-10
        title: Wireframe / maquettes statiques des pages clés
        priority: P1
        acceptance:
          - Maquettes HTML statiques pour homepage, fiche produit, panier, checkout, pages légales
          - Livrées dans _bmad-output/design-mockups/

